name: Local validation
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npx tsc -p tsconfig.tests.json --pretty false
      - run: npm run type-check:edge
      - run: npm run check:public
      - run: npm run test:docs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:55421
          VITE_SUPABASE_ANON_KEY: local-build-placeholder
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:55421
          VITE_SUPABASE_ANON_KEY: local-browser-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-results
          path: |
            coverage/
            playwright-report/
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/image-inspector/requirements.txt
      - run: python -m pip install --require-hashes -r services/image-inspector/requirements.txt
      - run: docker build -t cmor-image-inspector-validation services/image-inspector
      - name: Install local antivirus dependency
        run: |
          docker pull clamav/clamav@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
          node scripts/prepare-image-inspection.mjs --update
          for attempt in $(seq 1 60); do
            if python -m unittest discover -s services/image-inspector -p 'test_scanner.py'; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npx supabase start
      - run: npx playwright install --with-deps chromium
      - name: Baseline installation and upgrade
        run: |
          node scripts/reset-local-validation.mjs --baseline
          node scripts/prepare-upgrade-local.mjs
          npx supabase migration up --local
          EXPECT_UPGRADE_FIXTURE=1 npm run test:database
      - name: Clean installation
        run: |
          node scripts/reset-local-validation.mjs
          npm run test:database
      - run: npx supabase db lint --local --level error --fail-on error
      - run: npx supabase stop
        if: always()
      - run: docker stop cmor-flow-open-source-image-validation-clamav
        if: always()
  all-passed:
    runs-on: ubuntu-latest
    needs: [source,database,security-audit]
    if: always()
    steps:
      - run: test '${{ needs.source.result }}' = success && test '${{ needs.database.result }}' = success && test '${{ needs.security-audit.result }}' = success
  security-audit:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Scan history and exported sources with Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact=100 --no-banner
          mkdir /tmp/cmor-public-source
          git archive HEAD | tar -x -C /tmp/cmor-public-source
          /tmp/gitleaks dir /tmp/cmor-public-source --config .gitleaks.toml --redact=100 --no-banner
