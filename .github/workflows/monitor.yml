# Healthcheck Monitor for CMOR FLOW
# Runs every 5 minutes, creates GitHub Issue on failure, can also send webhook notifications
#
# Setup:
# 1. Push this file to .github/workflows/monitor.yml
# 2. In GitHub repo Settings → Secrets → Actions, add:
#    - SUPABASE_URL (e.g., https://<customer-project>.supabase.co)
#    - HEALTHCHECK_URL (e.g., https://<customer-project>.supabase.co/functions/v1/healthcheck)
#    - ALERT_WEBHOOK_URL (optional: Discord/Slack/n8n/Make webhook for instant alerts)
# 3. Enable Actions in repo Settings → Actions → General → Allow all actions

name: Production Healthcheck Monitor

on:
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes
  workflow_dispatch:  # Manual trigger from Actions tab

permissions:
  contents: read
  issues: write  # To create alert issues

jobs:
  healthcheck:
    name: Healthcheck
    # Explicit customer activation; no production calls or alerts by default.
    if: vars.PRODUCTION_MONITOR_ENABLED == 'true'
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Healthcheck Endpoint
        id: ping
        run: |
          set -euo pipefail
          [[ "$HEALTHCHECK_URL" == https://* ]] || { echo "HTTPS health endpoint required"; exit 1; }
          http_code=$(curl -sS --proto '=https' --max-time 30 --max-filesize 32768 \
            -o healthcheck_result.json -w '%{http_code}' "$HEALTHCHECK_URL" || true)
          [[ "$http_code" =~ ^[0-9]{3}$ ]] || http_code=000
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"

      - name: Parse Health Status
        id: parse
        run: |
          if jq -e '.ok == true' healthcheck_result.json >/dev/null 2>&1; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
          else
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Alert Issue on Failure
        if: steps.parse.outputs.status == 'unhealthy'
        uses: actions/github-script@v8
        with:
          script: |
            const body = 'Healthcheck returned an unhealthy response. Raw content intentionally excluded.';
            
            const title = `🚨 [ALERT] Production Healthcheck Failed - ${new Date().toISOString()}`;
            const issueBody = `## Healthcheck Failure Detected
            
            **Time:** ${new Date().toISOString()}
            **Workflow:** ${process.env.GITHUB_WORKFLOW}
            **Run:** ${process.env.GITHUB_RUN_ID}
            
            **Response:**
            \`\`\`json
            ${body}
            \`\`\`
            
            **Endpoint:** configured by the customer administrator
            
            ---
            *Auto-generated by GitHub Actions monitor. Check production immediately.*
            `;
            
            // Check if there's already an open alert issue to avoid spam
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['healthcheck-alert'],
              per_page: 5
            });
            
            const recentAlert = existing.data.find(issue => 
              issue.title.includes('Healthcheck Failed') && 
              (Date.now() - new Date(issue.created_at).getTime()) < 30 * 60 * 1000 // 30 min
            );
            
            if (recentAlert) {
              console.log('Recent alert issue exists, adding comment instead');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: recentAlert.number,
                body: `**New failure at ${new Date().toISOString()}**\n\n\`\`\`json\n${body}\n\`\`\``
              });
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
                labels: ['healthcheck-alert', 'production', 'urgent']
              });
              console.log('Created alert issue:', issue.data.html_url);
            }

      - name: Send Webhook Notification (Discord/Slack/n8n/Make)
        if: steps.parse.outputs.status == 'unhealthy' && env.ALERT_WEBHOOK_URL != ''
        run: |
          set -euo pipefail
          [[ "$ALERT_WEBHOOK_URL" == https://* ]] || { echo "HTTPS alert endpoint required"; exit 1; }
          payload=$(jq -n '{embeds:[{title:"CMOR FLOW healthcheck failed",description:"Review the configured monitor run; raw endpoint content excluded.",color:15158332}]}')
          curl -sS --proto '=https' --max-time 15 --output /dev/null \
            -X POST -H 'Content-Type: application/json' -d "$payload" "$ALERT_WEBHOOK_URL"

      - name: Log Success
        if: steps.parse.outputs.status == 'healthy'
        run: |
          echo "✅ Healthcheck OK at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

  # Optional: Daily summary issue
  daily-summary:
    name: Daily Health Summary
    runs-on: ubuntu-latest
    if: vars.PRODUCTION_MONITOR_ENABLED == 'true' && github.event_name == 'schedule' && github.event.schedule == '0 6 * * *'  # 6 AM UTC daily
    permissions:
      issues: write
    steps:
      - name: Get Recent Healthcheck Runs
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'monitor.yml',
              per_page: 288, // 5 min * 288 = 24 hours
              created: `>${new Date(Date.now() - 24*60*60*1000).toISOString()}`
            });
            
            const total = runs.data.total_count;
            const failures = runs.data.workflow_runs.filter(r => r.conclusion === 'failure').length;
            const success = total - failures;
            const successRate = total > 0 ? ((success / total) * 100).toFixed(1) : 100;
            
            const title = `📊 Daily Health Summary - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Healthcheck Summary (Last 24h)
            
            - **Total runs:** ${total}
            - **Successful:** ${success}
            - **Failed:** ${failures}
            - **Success rate:** ${successRate}%
            
            **Endpoint:** configured by the customer administrator
            
            ---
            *Auto-generated daily summary. Check [Actions tab](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions) for details.*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['healthcheck-summary', 'daily']
            });