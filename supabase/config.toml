# Supabase project config — CMOR FLOW
# Ver: https://supabase.com/docs/guides/cli/config
# Identificador local; los puertos 554xx aíslan esta pila de otros proyectos.

project_id = "cmor-flow-open-source-validation"

[api]
enabled = true
port = 55421
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false
port = 55429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 55423

[inbucket]
enabled = true
port = 55424

[storage]
enabled = true
file_size_limit = "5MB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/setup-password", "http://127.0.0.1:5173/setup-password"]
jwt_expiry = 3600
# refresh_token_rotation_enabled = true
# refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
template = {}
max_frequency = "1s"

[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_signup = false

[functions.verify-dsar]
verify_jwt = false

[functions.activate-trial-registration]
verify_jwt = false

# El registro de un restaurante es público. La función valida que la solicitud
# exista y esté pendiente antes de crear una intención de Flow; exigir un JWT
# impediría iniciar Básico, Pro y la licencia de por vida.
[functions.flow-checkout]
verify_jwt = false

[functions.flow-customer]
verify_jwt = true

[functions.flow-subscription]
verify_jwt = true

[functions.privacy-erase]
verify_jwt = false

[functions.privacy-access]
verify_jwt = false

[functions.privacy-export]
verify_jwt = false

[functions.privacy-rectify]
verify_jwt = false

[functions.privacy-object]
verify_jwt = false

[functions.privacy-revoke-consent]
verify_jwt = false

[functions.invite-owner]
verify_jwt = false

[functions.create-payment-intent]
verify_jwt = false

[functions.order-pay]
verify_jwt = false

# Contabilidad: la autorización vive en la función (patrón order-pay).
# Rutas del dueño validan el Bearer con requireRestaurantOwner; el cron
# usa X-Cron-Secret contra accounting_cron_secret.
[functions.accounting]
verify_jwt = false

[functions.webhooks]
verify_jwt = false

[functions.healthcheck]
verify_jwt = false

[functions.ai-recommendations]
verify_jwt = false

[functions.privacy-contact]
verify_jwt = false
[functions.mp-checkout]
verify_jwt = false
[functions.mp-webhook]
verify_jwt = false
[functions.menu-image]
verify_jwt = false

[functions.operations-readiness]
verify_jwt = false
